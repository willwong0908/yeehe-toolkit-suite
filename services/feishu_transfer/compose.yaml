services:
  gateway:
    image: yeehe-feishu-transfer:local
    build: .
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:18512:8000"]
    environment:
      HOME: /home/yeehe
      TRANSFER_HOME: /data
    volumes:
      - ./data:/data
      - ./bin/lark-cli:/data/bin/lark-cli:ro
      - ./feishu-transfer.json:/data/feishu-transfer.json:ro
      - /home/yeehe/.lark-cli:/home/yeehe/.lark-cli
      - /home/yeehe/.local/share/lark-cli:/home/yeehe/.local/share/lark-cli
    tmpfs: ["/tmp:size=256m,mode=1777"]
